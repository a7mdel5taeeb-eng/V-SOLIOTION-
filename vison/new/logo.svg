<svg width="500" height="150" viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007bff;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&amp;family=Arial:wght@900&amp;display=swap');
      .text { font-family: 'Arial', sans-serif; font-weight: 900; fill: #fff; }
      .brand { font-family: 'Cairo', sans-serif; font-weight: 800; fill: #fff; }
      .slogan { font-family: 'Cairo', sans-serif; font-weight: 600; fill: #00d4ff; }
    </style>
  </defs>

  <!-- خلفية سوداء مؤقتة لترى اللوجو (يمكنك حذف هذا السطر لتكون الخلفية شفافة) -->
  <rect width="100%" height="100%" fill="#0a0a0a"/>

  <!-- المربع المائل -->
  <g transform="translate(50, 25)">
    <rect x="0" y="0" width="100" height="100" rx="15" fill="url(#grad1)" transform="skewX(-10)" stroke="white" stroke-width="3"/>
    
    <!-- حرفي VS -->
    <text x="50" y="70" font-size="50" text-anchor="middle" class="text" transform="skewX(0)">VS</text>
  </g>

  <!-- اسم الشركة -->
  <g transform="translate(180, 75)">
    <text x="0" y="0" font-size="40" class="brand">رؤى وحلول</text>
    <text x="0" y="35" font-size="20" class="slogan" letter-spacing="2">للنقل والخدمات اللوجستية</text>
  </g>
</svg>