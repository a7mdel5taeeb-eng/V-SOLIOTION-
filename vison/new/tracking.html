  <main class="card"><h1>Shipment Status Request</h1><p>Send your tracking reference and contact details. Our team will reply with the current shipment status. This is a request form; live automated tracking is not configured yet.</p><form action="https://formsubmit.co/vsolutions615@gmail.com" method="POST" class="grid"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_subject" value="Shipment status request - Vision & Solution"><div class="full"><label for="reference">Tracking reference</label><input id="reference" name="Tracking_Reference" required placeholder="e.g. VS-12345"></div><div><label for="name">Full name</label><input id="name" name="Name" required></div><div><label for="phone">Phone number</label><input id="phone" name="Phone" type="tel" required></div><div class="full"><label for="email">Email address</label><input id="email" name="email" type="email" required></div><div class="full"><button type="submit">Request shipment status</button></div></form></main>
